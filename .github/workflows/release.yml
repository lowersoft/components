name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org
      # Publishing goes through npm trusted publishing (OIDC, granted by
      # id-token: write above), which needs npm 11.5.1 or later. No publish
      # token is stored, and provenance is attached automatically.
      - run: npm install --global npm@11
      - run: npm ci
      # The version is bumped on a maintainer's machine with
      # `npm run version-packages`, which turns the pending changesets into
      # the new version and changelog, and pushed to main; this job then
      # publishes it and tags the release. While changesets are pending there
      # is nothing to publish, and the action would instead open a "Version
      # Packages" pull request, which this repository does not let Actions do.
      - id: pending
        run: echo "count=$(find .changeset -name '*.md' ! -name README.md | wc -l)" >> "$GITHUB_OUTPUT"
      - if: steps.pending.outputs.count == '0'
        uses: changesets/action@v1
        with:
          publish: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
