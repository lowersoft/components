name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org
      # Publishing goes through npm trusted publishing (OIDC, granted by
      # id-token: write above), which needs npm 11.5.1 or later. No publish
      # token is stored, and provenance is attached automatically.
      - run: npm install --global npm@11
      - run: npm ci
      # The version is bumped on a maintainer's machine with
      # `npm run version-packages` and pushed to main; this repository does
      # not let Actions open the "Version Packages" pull request instead.
      # Every push publishes whatever version main carries that npm does not
      # have yet, then tags it and creates its GitHub release; otherwise it
      # does nothing.
      - uses: changesets/action/publish@v2
        with:
          script: npm run release
